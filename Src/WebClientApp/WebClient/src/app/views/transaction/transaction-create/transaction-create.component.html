<div class="component-header">
    <div>
        <i
            class="bi bi-arrow-left-circle pointer"
			appGoPageBack
            style="cursor: pointer"
        ></i>
        &nbsp;&nbsp;
        <span>New Transaction</span>
    </div>
    <div class="d-flex align-items-end h-100">
		<app-income-slider
			[isIncome]="this.transactionService.newTransaction.isIncome"
			(setTransactionTypeEmitter)="setTransactionType($event)"
		></app-income-slider>
    </div>
</div>

<div class="mainChild">
    <div>
        <input
            class="default-input primary"
            type="text"
            [(ngModel)]="this.transactionService.newTransaction.name"
            placeholder="Transaction Name"
        />
    </div>
    <div>
        <input
            class="default-input primary"
            type="text"
            [(ngModel)]="this.transactionService.newTransaction.amount"
            placeholder="Transaction Amount"
        />
    </div>
    <!-- <div>
        <input
            class="default-input primary"
            type="text"
            [(ngModel)]="this.transactionService.newTransaction.currencyCode"
            placeholder="Transaction Currency Code"
        />
    </div> -->
	<!-- <br> -->
    <div
        class="wallet_select">
        <app-dropdown-wallet
            [selectedWallet]="this.newWallet"
            [wallets]="walletService.wallets"
            (selectWalletEmitter)="selectWallet($event)"
        ></app-dropdown-wallet>
    </div>
</div>

<button class="default-button bottom-button" (click)="addTransaction()">
    Create Wallet
</button>
