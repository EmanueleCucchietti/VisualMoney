<div class="component-header">
    <div>
        <i class="bi bi-arrow-left-circle pointer" appGoPageBack style="cursor: pointer"></i>
        &nbsp;&nbsp;
        <span>{{ this.transactionService.selectedTransaction.name }}</span>
    </div>
    <div class="d-flex align-items-end">
        <app-income-slider [readonly]="isReadOnly" [isIncome]="this.transactionService.selectedTransaction.isIncome"
            (setTransactionTypeEmitter)="setTransactionType($event)"></app-income-slider>
    </div>
</div>

<div class="mainChild">
    <div class="inner_page">
        <app-category-selector 
            [isReadOnly]="isReadOnly"
            [oldCategories]="oldCategories"
            [notPresentCategories]="notPresentCategories"
            ></app-category-selector>

        <div class="default-input composed-input primary d-flex">
            <label for="name" class="default-label">Name</label>
            <input [readonly]="isReadOnly" class="no-style-input inner-input" type="text" id="name"
                [(ngModel)]="transactionService.selectedTransaction.name" placeholder="Transaction Name" />
        </div>
        <div class="default-input composed-input primary d-flex">
            <label for="name" class="default-label">Amount</label>
            <input style="min-width: 50px; text-decoration: none;" [readonly]="isReadOnly"
                class="no-style-input inner-input" type="number" id="name"
                [(ngModel)]="transactionService.selectedTransaction.amount" placeholder="Transaction Name" />
            <input style="text-align: right; margin-right: 15px; min-width: 50px;" [readOnly]="true"
                class="no-style-input inner-input" type="text" id="name"
                [ngModel]="transactionService.selectedTransaction.currencyCode" placeholder="Transaction Name" />
        </div>
        <app-datepicker class="m-datepicker" (dateChange)="changeDate($event)" [showLabel]="true" [showOuterDiv]="true"
            [isReadOnly]="isReadOnly" [dateValue]="transactionService.selectedTransaction.date"></app-datepicker>
        <!-- <div class="default-input composed-input primary d-flex">
            <label for="name" class="default-label">Currency Code</label>
            <input
                [readonly]="isReadOnly"
                class="no-style-input inner-input"
                type="text"
                id="name"
                [(ngModel)]="transactionService.selectedTransaction.currencyCode"
                placeholder="Transaction Name"
            />
        </div> -->

        <app-dropdown-wallet class="dropdown-wallet" [readonly]="isReadOnly" [selectedWallet]="selectedWallet"
            [wallets]="walletService.wallets" (selectWalletEmitter)="selectWallet($event)"></app-dropdown-wallet>
    </div>

    <div class="page_buttons">

        <div *ngIf="showEditButtons" class="edit_button"
            ngClass="{{ !isReadOnly ? 'active' : !firstLoad ? 'off' : '' }}">
            <div id="buttonCreate" class="default-button bottom-button invert-button"
                ngClass="{{ !isReadOnly ? 'active' : '' }}">
                <div class="button-create" ngClass="{{ !isReadOnly ? 'active' : !firstLoad ? 'off' : '' }}"
                    (click)="editTransaction()">
                    <div class="button-create-text secondary">
                        <span *ngIf="isReadOnly"><i _ngcontent-ng-c3584920150="" class="bi bi-pencil"></i></span>
                    </div>
                </div>
                <div class="cancel-confirm-container">
                    <div class="sub-button" (click)="cancelEditTransaction()">
                        <span class="primary font-weight-bold"><i class="bi bi-x"></i></span>
                    </div>
                    <div class="sub-button" (click)="confirmEditTransaction()">
                        <span class="primary font-weight-bold"><i class="bi bi-check"></i></span>
                    </div>
                </div>
            </div>
        </div>

        <app-delete-choice-sub-button *ngIf="showDeleteButtons" (deleteEventHandler)="deleteTransaction()"
            (tryDeleteEventHandler)="tryDeleteEventHandler()" (cancelEventHandler)="cancelEventHandler()">


        </app-delete-choice-sub-button>



    </div>
</div>
